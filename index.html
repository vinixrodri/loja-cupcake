<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doce Sabor - Cupcakes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🧁 Doce Sabor Cupcakes</h1>
        <p>Feitos com amor para o seu dia!</p>
    </header>

    <main>
        <section class="produtos" id="lista-produtos">
            <!-- Os produtos serão injetados aqui pelo JavaScript -->
        </section>

        <aside class="carrinho">
            <h2>🛒 Seu Carrinho</h2>
            <ul id="itens-carrinho">
                <p>O carrinho está vazio.</p>
            </ul>
            <div class="total">
                <strong>Total: R$ <span id="valor-total">0.00</span></strong>
            </div>
            <button onclick="finalizarCompra()">Finalizar no WhatsApp</button>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
